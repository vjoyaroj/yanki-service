version: "3.9"


services:


  mongodb:
    image: mongo:7
    container_name: mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 30s

  
  config-server:
    build:
      context: ./microservices-config
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./bank-config-repo:/config
    environment:
      SPRING_PROFILES_ACTIVE: "native"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:/config"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 40s


  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URI: "http://config-server:8888"
      SPRING_MONGODB_URI: "mongodb://mongodb:27017/transactiondb?retryWrites=false"
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: "27017"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bank-network


  accounts-service:
    build:
      context: ./accounts-service
      dockerfile: Dockerfile
    container_name: accounts-service
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URI: "http://config-server:8888"
      SPRING_MONGODB_URI: "mongodb://mongodb:27017/yankidb?retryWrites=false"
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: "27017"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      # WebClient targets for cross-service calls
      CUSTOMER_SERVICE_URL: "http://customer-service:8081/api/v1"
      CREDIT_SERVICE_URL: "http://credits-service:8083/api/v1"
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bank-network


  credits-service:
    build:
      context: ./credits-service
      dockerfile: Dockerfile
    container_name: credits-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URI: "http://config-server:8888"
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: "27017"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      # Dentro del contenedor localhost ≠ host; WebClient debe usar el nombre del servicio en la red Docker
      CUSTOMER_SERVICE_URL: "http://customer-service:8081/api/v1"
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bank-network


  transactions-service:
    build:
      context: ./transactions-service
      dockerfile: Dockerfile
    container_name: transactions-service
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URI: "http://config-server:8888"
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: "27017"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      ACCOUNT_SERVICE_URL: "http://accounts-service:8082/api/v1"
      CREDIT_SERVICE_URL: "http://credits-service:8083/api/v1"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - bank-network


  debit-cards-service:
    build:
      context: ./debit-cards-service
      dockerfile: Dockerfile
    container_name: debit-cards-service
    ports:
      - "8085:8085"
    environment:
      CONFIG_SERVER_URI: "http://config-server:8888"
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: "27017"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      ACCOUNT_SERVICE_URL: "http://accounts-service:8082/api/v1"
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bank-network


  yanki-service:
    build:
      context: ./yanki-service
      dockerfile: Dockerfile
    container_name: yanki-service
    ports:
      - "8086:8086"
    environment:
      CONFIG_SERVER_URI: "http://config-server:8888"
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: "27017"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      ACCOUNT_SERVICE_URL: "http://accounts-service:8082/api/v1"
      DEBITCARD_SERVICE_URL: "http://debit-cards-service:8085/api/v1"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - bank-network


  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: redpandadata/redpanda:v24.2.10
    container_name: kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: *true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s


  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8090:8090"
    environment:
      CONFIG_SERVER_URI: "http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - bank-network


volumes:
  mongo-data:
    driver: local

networks:
  bank-network:
    driver: bridge
